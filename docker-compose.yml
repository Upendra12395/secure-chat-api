services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ChangeMe123!
      MYSQL_DATABASE: secure_chat
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3307:3307"
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    volumes:
      - ./:/usr/src/app
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: development
    env_file:
      - .env
    command: ["sh", "-c", "npm run dev"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  db_data:
